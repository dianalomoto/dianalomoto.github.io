<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/jZqMKjSS/dianalomoto.png">
    
    <!-- Tailwind & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 15vw, 10rem);
            line-height: 1;
            font-weight: 900;
            color: #005c30;
            margin-bottom: 1rem;
            position: relative;
        }

        .error-code::after {
            content: '404';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffc600;
            z-index: -1;
            opacity: 0.3;
        }

        .btn-home {
            background-color: #005c30;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-top: 2rem;
            text-decoration: none;
        }

        .btn-home:hover {
            background-color: #004a26;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 92, 48, 0.15);
        }

        .minimal-footer {
            margin-top: auto;
            padding: 2rem;
            text-align: center;
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="mb-6 flex justify-center">
            <div class="w-20 h-20 bg-slate-100 rounded-3xl flex items-center justify-center text-[#ffc600]">
                <i data-lucide="map" class="w-10 h-10"></i>
            </div>
        </div>
        
        <h1 class="error-code">404</h1>
        
        <h2 class="text-2xl font-black text-[#005c30] mb-4 font-serif">Página no encontrada</h2>
        
        <p class="text-slate-500 text-sm leading-relaxed">
            Lo sentimos, el recurso que estás buscando parece haber cambiado de lugar o no existe en este repositorio académico.
        </p>

        <a href="/" class="btn-home">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al Inicio
        </a>
    </div>

    <!-- Footer Minimalista sin franja -->
    <footer class="minimal-footer">
        <p>© 2025 · Proyecto Académico Digital · Todos los derechos reservados</p>
        <p>Educación Inicial · UPEC</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
